<!doctype html>
<html lang="en" class="dark" data-theme="dracula">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Learn SQL by solving real-world assignments. Write queries, execute them, and see results instantly."
        />
        <title>M SQL Studio</title>
        <script>
            (() => {
                try {
                    const stored = localStorage.getItem("mss-theme");
                    if (stored === "light") {
                        document.documentElement.classList.remove("dark");
                        document.documentElement.classList.add("light");
                        document.documentElement.setAttribute(
                            "data-theme",
                            "alucard",
                        );
                    }
                } catch (_e) {}
            })();
        </script>
    </head>
    <body class="antialiased">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
